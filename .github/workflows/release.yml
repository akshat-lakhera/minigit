name: Release

# Builds stand-alone minigit executables for Windows, Linux and macOS, a Windows installer
# and a Python wheel, then attaches them to a GitHub release. Runs when a tag "v*" is
# pushed; "workflow_dispatch" builds the artifacts without publishing a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        shell: bash
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --onefile --console --noconfirm --clean \
            --name minigit --collect-submodules minigit --paths . \
            --distpath dist --workpath build --specpath build packaging/entry.py

      - name: Smoke test
        shell: bash
        run: |
          mkdir smoke && cd smoke
          ../dist/minigit --version
          ../dist/minigit init repo
          cd repo
          ../../dist/minigit config user.name ci
          ../../dist/minigit config user.email ci@example.com
          echo hello > a.txt
          ../../dist/minigit add .
          ../../dist/minigit commit -m first
          ../../dist/minigit log --oneline
          ../../dist/minigit switch -c feature
          echo more >> a.txt
          ../../dist/minigit add . && ../../dist/minigit commit -m second
          ../../dist/minigit switch main
          ../../dist/minigit merge feature
          ../../dist/minigit log --oneline | grep -q second

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DSourceDir=$PWD\dist" packaging\minigit.iss
          Compress-Archive -Path dist\minigit.exe -DestinationPath "dist\minigit-$v-windows-x64.zip"
          Remove-Item dist\minigit.exe
          Get-ChildItem dist

      - name: Package (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p stage/minigit-$v
          cp dist/minigit packaging/install.sh stage/minigit-$v/
          chmod 755 stage/minigit-$v/minigit stage/minigit-$v/install.sh
          tar -C stage -czf "dist/minigit-$v-${{ matrix.label }}.tar.gz" "minigit-$v"
          rm dist/minigit
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  wheel:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          v="${tag#v}"
          sed "s/{VERSION}/$v/g" packaging/release-notes.md > notes.md
          gh release create "$tag" assets/* --title "minigit $v" --notes-file notes.md
